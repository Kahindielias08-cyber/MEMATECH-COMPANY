<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission | Elias Website</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
}

header{
background:#0dd9fd;
color:white;
text-align:center;
padding:15px;
}

.container{
width:90%;
max-width:900px;
margin:auto;
padding:50px 0;
}

.title{
text-align:center;
color:#0dcdfd;
margin-bottom:30px;
}

form{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:8px;
}

button{
background:#0dc1fd;
color:white;
border:none;
padding:15px 30px;
border-radius:8px;
cursor:pointer;

}

button:hover{
background:#0babf6;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:50px;
}

</style>

<body>

<header>
<h1>MEMATECH COMPANY</h1>
</header>

<div class="container">

<h2 class="title">Student Admission Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name">

<label>Phone Number</label>
<input type="tel" placeholder="Enter phone number">

<label>Email Address</label>
<input type="email" placeholder="Enter email">

<label>Select Course</label>

<select>
<option>Basic Computer Application</option>
<option>Microsoft Word</option>
<option>Microsoft Excel</option>
<option>Microsoft PowerPoint</option>
<option>Internet & Email Skills</option>
<option>Computer Maintenance</option>
<option>Graphic Design</option>
<option>Web Development</option>
</select>

<label>Message</label>

<textarea rows="5" placeholder="Write your message"></textarea>

<button type="submit">
Apply Now
</button>

</form>

</div>

<footer>
